name: Test and deploy

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: npm test
      - run: php -l utmkeeperflow.php
      - run: php tests/php/bootstrap.php

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version and icons
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be a version like 0.1.0"; exit 1; }
          [[ "$(awk '/^Stable tag:/ {print $3}' readme.txt)" == "$version" ]] || { echo "readme.txt Stable tag differs from tag"; exit 1; }
          [[ "$(awk '/^ \* Version:/ {print $3}' utmkeeperflow.php)" == "$version" ]] || { echo "Plugin header Version differs from tag"; exit 1; }
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for size in (128, 256):
              path = Path(f'.wordpress-org/icon-{size}x{size}.png')
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', data[16:24]) == (size, size)
              assert len(data) <= 1_000_000
          PY
      - name: Deploy release to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: utmkeeperflow
